# Blueprint Render (https://render.com/docs/blueprint-spec)
# Déploiement : Render Dashboard > New > Blueprint > pointer sur ce repo.
services:
  - type: web
    name: credit-scoring-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SCORING_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: credit-scoring-db
          property: connectionString
      - key: RATELIMIT_ENABLE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: credit-scoring-db
    plan: starter
    postgresMajorVersion: 16
